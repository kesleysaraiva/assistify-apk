name: Build Assistify APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name assistify --org com.assistify --platforms=android
          fi

      - name: Patch Android for media_kit
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          import re

          for name in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              p = Path(name)
              if not p.exists():
                  continue
              t = p.read_text(encoding="utf-8")

              # SDK
              t = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 34', t)
              t = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 34', t)
              t = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 34', t)
              t = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 34', t)
              t = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 24', t)
              t = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 24', t)
              t = re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 24', t)
              t = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 24', t)
              t = re.sub(r'targetSdk\s*=\s*flutter\.targetSdkVersion', 'targetSdk = 34', t)
              t = re.sub(r'targetSdkVersion\s+flutter\.targetSdkVersion', 'targetSdkVersion 34', t)
              t = re.sub(r'targetSdk\s*=\s*\d+', 'targetSdk = 34', t)
              t = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 34', t)

              # ndkVersion importante para media_kit
              if 'ndkVersion' not in t:
                  t = re.sub(r'(android\s*\{)', r'\1\n    ndkVersion = "25.1.8937393"\n', t, count=1)

              if 'compileSdk' not in t and 'compileSdkVersion' not in t:
                  t = re.sub(r'(android\s*\{)', r'\1\n    compileSdk = 34\n', t, count=1)

              p.write_text(t, encoding="utf-8")
              print(f"Patched {name}")

          # network security
          xml_dir = Path("android/app/src/main/res/xml")
          xml_dir.mkdir(parents=True, exist_ok=True)
          (xml_dir / "network_security_config.xml").write_text(
              """<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          """, encoding="utf-8")

          # Manifest
          man = Path("android/app/src/main/AndroidManifest.xml")
          t = man.read_text(encoding="utf-8")
          for perm in [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_WIFI_STATE",
              "android.permission.WAKE_LOCK",
          ]:
              if perm not in t:
                  t = t.replace("<application", f'    <uses-permission android:name="{perm}"/>\n    <application', 1)
          t = re.sub(r'\s*android:usesCleartextTraffic="[^"]*"', "", t)
          t = re.sub(r'\s*android:networkSecurityConfig="[^"]*"', "", t)
          t = t.replace(
              "<application ",
              '<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml/network_security_config" ',
              1,
          )
          t = re.sub(r'android:label="[^"]*"', 'android:label="Assistify"', t)
          man.write_text(t, encoding="utf-8")

          values = Path("android/app/src/main/res/values")
          values.mkdir(parents=True, exist_ok=True)
          (values / "strings.xml").write_text(
              '<resources><string name="app_name">Assistify</string></resources>\n', encoding="utf-8")
          print("Android patch done")
          PY

      - name: Dependencies
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons || true

      - name: Build APK
        run: flutter build apk --release --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: assistify-apk
          path: build/app/outputs/flutter-apk/app-release.apk
