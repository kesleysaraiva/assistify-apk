name: Build Assistify APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name assistify --org com.assistify --platforms=android
          fi

      - name: Patch Android (cleartext HTTP + permissões + nome)
        run: |
          set -e

          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/flutter.compileSdkVersion/34/g' "$f"
              sed -i 's/flutter.minSdkVersion/24/g' "$f"
              sed -i 's/flutter.targetSdkVersion/34/g' "$f"
            fi
          done

          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          XML

          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            sed -i 's/ android:usesCleartextTraffic="[^"]*"//g' "$MANIFEST"
            sed -i 's/ android:networkSecurityConfig="[^"]*"//g' "$MANIFEST"
            sed -i 's/<application /<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml\/network_security_config" /' "$MANIFEST"

            if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
              sed -i 's|<application|    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application|' "$MANIFEST"
            fi

            sed -i 's/android:label="[^"]*"/android:label="Assistify"/' "$MANIFEST"
          fi

          mkdir -p android/app/src/main/res/values
          echo '<resources><string name="app_name">Assistify</string></resources>' > android/app/src/main/res/values/strings.xml

          echo "=== application tag ==="
          grep -n "<application" "$MANIFEST" || true

      - name: Dependencies
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: assistify-apk
          path: build/app/outputs/flutter-apk/app-release.apk
