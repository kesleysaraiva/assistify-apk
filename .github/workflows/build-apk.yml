name: Build Assistify APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name assistify --org com.assistify --platforms=android
          fi

      - name: Patch Android config
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/flutter.compileSdkVersion/34/g' "$f"
              sed -i 's/flutter.minSdkVersion/24/g' "$f"
              sed -i 's/flutter.targetSdkVersion/34/g' "$f"
            fi
          done
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            grep -q usesCleartextTraffic "$MANIFEST" || sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST"
            grep -q android.permission.INTERNET "$MANIFEST" || sed -i 's|<application|    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application|' "$MANIFEST"
          fi

      - name: Dependencies
        run: flutter pub get

      - name: App icon Assistify
        run: |
          dart pub add dev:flutter_launcher_icons
          printf '%s\n' \
            'flutter_launcher_icons:' \
            '  android: true' \
            '  ios: false' \
            '  image_path: assets/logo-icon.png' \
            '  adaptive_icon_background: "#0A0A0A"' \
            '  adaptive_icon_foreground: assets/logo-icon.png' \
            > /tmp/icons.yaml
          # merge via flutter_launcher_icons using pubspec if section exists, else run with defaults from pubspec
          dart run flutter_launcher_icons || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: assistify-apk
          path: build/app/outputs/flutter-apk/app-release.apk
