name: Build Assistify APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name assistify --org com.assistify --platforms=android
          fi

      - name: Fix compileSdk minSdk manifest
        run: |
          set -e
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/flutter.compileSdkVersion/34/g' "$f"
              sed -i 's/flutter.minSdkVersion/24/g' "$f"
              sed -i 's/flutter.targetSdkVersion/34/g' "$f"
              sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' "$f" || true
              sed -i 's/compileSdk = .*/compileSdk = 34/' "$f" || true
              sed -i 's/minSdkVersion .*/minSdkVersion 24/' "$f" || true
              sed -i 's/minSdk = .*/minSdk = 24/' "$f" || true
              sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' "$f" || true
              sed -i 's/targetSdk = .*/targetSdk = 34/' "$f" || true
              echo "patched $f"
              cat "$f" | head -80
            fi
          done
          if [ -f android/build.gradle ]; then
            if ! grep -q 'compileSdkVersion 34' android/build.gradle; then
              cat >> android/build.gradle << 'EOF'

          subprojects { sub ->
            sub.afterEvaluate {
              if (sub.hasProperty('android')) {
                sub.android {
                  compileSdkVersion 34
                }
              }
            }
          }
          EOF
            fi
          fi
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            grep -q usesCleartextTraffic "$MANIFEST" || sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST"
            grep -q android.permission.INTERNET "$MANIFEST" || sed -i 's|<application|    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application|' "$MANIFEST"
          fi

      - name: Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: assistify-apk
          path: build/app/outputs/flutter-apk/app-release.apk
