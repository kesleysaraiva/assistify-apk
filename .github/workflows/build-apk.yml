name: Build Assistify APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name assistify --org com.assistify --platforms=android
          fi

      - name: Patch Android (cleartext HTTP + permissões)
        run: |
          set -e

          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/flutter.compileSdkVersion/34/g' "$f"
              sed -i 's/flutter.minSdkVersion/24/g' "$f"
              sed -i 's/flutter.targetSdkVersion/34/g' "$f"
              sed -i 's/minSdk .*/minSdk = 24/' "$f" || true
              sed -i 's/minSdkVersion .*/minSdkVersion 24/' "$f" || true
            fi
          done

          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          XML

          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          t = p.read_text(encoding="utf-8")
          # permissions
          for perm in [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_WIFI_STATE",
              "android.permission.WAKE_LOCK",
          ]:
              if perm not in t:
                  t = t.replace(
                      "<application",
                      f'    <uses-permission android:name="{perm}"/>\n    <application',
                      1,
                  )
          # strip old attrs then inject
          t = re.sub(r'\s*android:usesCleartextTraffic="[^"]*"', '', t)
          t = re.sub(r'\s*android:networkSecurityConfig="[^"]*"', '', t)
          t = t.replace(
              "<application ",
              '<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml/network_security_config" ',
              1,
          )
          t = re.sub(r'android:label="[^"]*"', 'android:label="Assistify"', t)
          p.write_text(t, encoding="utf-8")
          print(p.read_text(encoding="utf-8")[:1500])
          PY

      - name: Dependencies
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: assistify-apk
          path: build/app/outputs/flutter-apk/app-release.apk
