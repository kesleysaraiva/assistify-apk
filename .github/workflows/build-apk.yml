name: Build Assistify APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name assistify --org com.assistify --platforms=android
          fi

      - name: Patch app compileSdk minSdk manifest
        run: |
          set -e
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/flutter.compileSdkVersion/34/g' "$f"
              sed -i 's/flutter.minSdkVersion/24/g' "$f"
              sed -i 's/flutter.targetSdkVersion/34/g' "$f"
              sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/' "$f" || true
              sed -i 's/compileSdk = [0-9]*/compileSdk = 34/' "$f" || true
              sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/' "$f" || true
              sed -i 's/minSdk = [0-9]*/minSdk = 24/' "$f" || true
              sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/' "$f" || true
              sed -i 's/targetSdk = [0-9]*/targetSdk = 34/' "$f" || true
            fi
          done
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            grep -q usesCleartextTraffic "$MANIFEST" || sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST"
            grep -q android.permission.INTERNET "$MANIFEST" || sed -i 's|<application|    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application|' "$MANIFEST"
          fi

      - name: Dependencies
        run: flutter pub get

      - name: Patch plugin compileSdk in pub-cache
        run: |
          PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          if [ -d "$PUB_CACHE" ]; then
            find "$PUB_CACHE" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) 2>/dev/null | while read -r f; do
              sed -i 's/flutter.compileSdkVersion/34/g' "$f" 2>/dev/null || true
            done
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: assistify-apk
          path: build/app/outputs/flutter-apk/app-release.apk
