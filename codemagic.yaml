workflows:
  android-workflow:
    name: Assistify Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.assistify.iptv"
    scripts:
      - name: Set up project
        script: |
          # Garante estrutura Android se ainda não existir
          if [ ! -d "android" ]; then
            flutter create . --project-name assistify --org com.assistify --platforms=android
          fi
          flutter pub get
      - name: Internet permission + cleartext
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i.bak 's|<manifest |<manifest |\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n|' "$MANIFEST" || true
          fi
          if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i.bak 's|<application |<application android:usesCleartextTraffic="true" |' "$MANIFEST" || true
          fi
          cat "$MANIFEST" | head -40
      - name: Build APK Release
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - $CM_EMAIL
        notify:
          success: true
          failure: true
